import org.apache.commons.configuration2.PropertiesConfiguration
import org.apache.commons.configuration2.builder.FileBasedConfigurationBuilder
import org.apache.commons.configuration2.builder.fluent.Parameters
import org.apache.commons.configuration2.convert.DefaultListDelimiterHandler

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.apache.commons:commons-configuration2:2.7'
        classpath 'commons-beanutils:commons-beanutils:1.9.3'
    }
}

plugins {
    id 'groovy'
    id 'idea'
    id 'com.energizedwork.idea-base' version '1.4'
}

// Load test suites from build.properties
def suites = []
try{
    def buildProps = new FileBasedConfigurationBuilder(PropertiesConfiguration)
            .configure(new Parameters().properties()
                    .setFileName(new File(projectDir, "build.properties").absolutePath)
                    .setListDelimiterHandler(new DefaultListDelimiterHandler(',' as char)))
            .getConfiguration()
    suites = buildProps.getList('uiTestSuites', [])
} catch (Exception e) {
    println('${projectDir}': projectDir)
    println " Warning: build.properties not found or invalid. Using default test suites."
    println "Error details: ${e.message}"
    e.printStackTrace()
}

ext {
    gebVersion = '3.0.1'
    seleniumVersion = '4.34.0'
    uiTestSuites = suites
}

repositories {
    mavenCentral()
    jcenter()
}

dependencies {
    // Testing frameworks
    implementation "org.gebish:geb-spock:$gebVersion"
    implementation("org.spockframework:spock-core:1.3-groovy-2.5") {
        exclude group: "org.codehaus.groovy"
    }

    // Selenium Drivers
    implementation "org.seleniumhq.selenium:selenium-chrome-driver:$seleniumVersion"
    implementation "org.seleniumhq.selenium:selenium-support:$seleniumVersion"
    implementation "org.seleniumhq.selenium:selenium-firefox-driver:$seleniumVersion"

    // Data generation
    implementation 'io.codearte.jfairy:jfairy:0.5.8'
    implementation 'io.qala.datagen:qala-datagen:1.9.2'
    // Apache HttpClient for SSL and Request handling
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'org.apache.httpcomponents:httpcore:4.4.13'

    // REST API
    implementation 'org.codehaus.groovy.modules.http-builder:http-builder:0.7.1'

    // Spock reporting
    implementation 'com.aoe:geb-spock-reports:0.2.0'
    implementation('com.athaydes:spock-reports:1.6.0') {
        transitive = false
    }

    // Logging
    implementation 'org.slf4j:slf4j-api:1.7.13'
    implementation 'org.slf4j:slf4j-simple:1.7.13'

}

// Example WebDriver binaries config (commented out)
/*
webdriverBinaries {
    chromedriver chromeDriverVersion
    geckodriver geckoDriverVersion
}
*/

test {
    group 'Geb'
    description 'Runs tests defined by parameters: -Dgeb.env=[dev,smoke] -Dsuite=[smoke] -Dretry=[true,false]'

    systemProperty 'webdriver.chrome.driver', "$projectDir/src/test/driver/chromedriver"
    systemProperty 'geb.env', System.properties['geb.env'] ?: 'dev'
    systemProperty 'retry', System.properties['retry'] ?: false
    systemProperty 'geb.reportDir', file("${buildDir}/geb-reports")

    useJUnit {
        uiTestSuites.each { category ->
            includeCategories(category)
        }
    }
}

task localtest(type: Test) {

    systemProperty 'webdriver.chrome.driver', "$projectDir/src/test/driver/chromedriver"
    systemProperty 'geb.env', 'dev'
    systemProperty 'suite', 'Regression'
    systemProperty 'retry', false
    systemProperty 'geb.reportDir', file("${buildDir}/geb-reports")

    group = 'Geb'
    description = 'Runs limited regression on dev environment with no retry'

    useJUnit {
        uiTestSuites.each { category ->
            includeCategories(category)
        }
    }
}

tasks.withType(Test).configureEach {
    systemProperties System.properties as Map<String, ?>
    dependsOn 'cleanTest'

    testLogging {
        events 'started', 'skipped', 'passed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

defaultTasks 'test'
